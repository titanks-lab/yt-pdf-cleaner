name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pymupdf ttkbootstrap pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "YT-PDFCleaner" `
            --windowed `
            --onefile `
            --icon NONE `
            --add-data "core;core" `
            --add-data "gui;gui" `
            --add-data "README.md;." `
            --hidden-import "pymupdf" `
            --hidden-import "ttkbootstrap" `
            --hidden-import "tkinter" `
            --hidden-import "tkinter.filedialog" `
            --hidden-import "tkinter.messagebox" `
            --hidden-import "tkinter.ttk" `
            --collect-all "ttkbootstrap" `
            --clean `
            -y `
            main.py

      - name: Package as ZIP
        run: |
          Compress-Archive -Path "dist/YT-PDFCleaner.exe" -DestinationPath "YT-PDFCleaner-v${{ github.ref_name }}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: YT-PDFCleaner ${{ github.ref_name }}
          body: |
            ## YT-PDFCleaner ${{ github.ref_name }}

            ### 🚀 绿色版，解压即用
            - 无需安装 Python
            - 无需安装任何依赖
            - 双击 `YT-PDFCleaner.exe` 即可运行

            ### 功能
            - 🎯 单个 PDF 去水印
            - 📁 批量处理整个文件夹
            - 🔄 输出 PDF 或 Markdown
            - 🖥️ 图形界面操作

            ### 使用方式
            1. 下载 `YT-PDFCleaner-v*.zip`
            2. 解压到任意目录
            3. 双击 `YT-PDFCleaner.exe`
          files: |
            YT-PDFCleaner-v${{ github.ref_name }}.zip
          draft: false
          prerelease: false
