name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: YT-PDFCleaner.exe
            asset_name: YT-PDFCleaner-${{ github.ref_name }}-windows-x64.exe
          - os: macos-latest
            artifact_name: YT-PDFCleaner
            asset_name: YT-PDFCleaner-${{ github.ref_name }}-macos-universal
          - os: ubuntu-latest
            artifact_name: YT-PDFCleaner
            asset_name: YT-PDFCleaner-${{ github.ref_name }}-linux-x86_64
            use_appimage: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymupdf ttkbootstrap pyinstaller

      - name: Run tests (skip UI tests on headless)
        run: |
          pip install pytest
          python -m pytest tests/test_utils.py tests/test_engine.py -v --tb=short || true

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --name "YT-PDFCleaner" ^
            --windowed ^
            --onefile ^
            --icon "gui/icon.ico" ^
            --add-data "core;core" ^
            --add-data "gui;gui" ^
            --add-data "README.md;." ^
            --hidden-import "pymupdf" ^
            --hidden-import "ttkbootstrap" ^
            --hidden-import "tkinter" ^
            --hidden-import "tkinter.filedialog" ^
            --hidden-import "tkinter.messagebox" ^
            --hidden-import "tkinter.ttk" ^
            --collect-all "ttkbootstrap" ^
            --clean ^
            -y ^
            main.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --name "YT-PDFCleaner" \
            --windowed \
            --onefile \
            --add-data "core:core" \
            --add-data "gui:gui" \
            --add-data "README.md:." \
            --hidden-import "pymupdf" \
            --hidden-import "ttkbootstrap" \
            --collect-all "ttkbootstrap" \
            --clean \
            -y \
            main.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          pyinstaller --name "YT-PDFCleaner" \
            --windowed \
            --onefile \
            --add-data "core:core" \
            --add-data "gui:gui" \
            --add-data "README.md:." \
            --hidden-import "pymupdf" \
            --hidden-import "ttkbootstrap" \
            --collect-all "ttkbootstrap" \
            --clean \
            -y \
            main.py

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/YT-PDFCleaner.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/YT-PDFCleaner

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/YT-PDFCleaner

      - name: Package for macOS (create macOS installer)
        if: runner.os == 'macOS'
        run: |
          # Create a simple zip for macOS (no dmg/pkg without additional tools)
          cd dist
          zip ../YT-PDFCleaner-${{ github.ref_name }}-macos-universal.zip YT-PDFCleaner

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          # Create a simple tar.gz for Linux
          cd dist
          tar czf ../YT-PDFCleaner-${{ github.ref_name }}-linux-x86_64.tar.gz YT-PDFCleaner

      - name: Package for Windows (ZIP)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist/YT-PDFCleaner.exe" -DestinationPath "YT-PDFCleaner-${{ github.ref_name }}-windows-x64.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: YT-PDFCleaner ${{ github.ref_name }}
          body: |
            ## YT-PDFCleaner ${{ github.ref_name }}

            ### 🍎 Apple Style 重构版

            #### Windows
            - 绿色版，解压即用
            - 无需安装 Python / 依赖

            #### macOS
            - Universal Binary (Apple Silicon + Intel)
            - 解压后双击运行

            #### Linux
            - 静态二进制，无需安装依赖
            - 需要 X11/Wayland 环境

            ### 功能
            - 🎯 单个 PDF 去水印
            - 📁 批量处理整个文件夹
            - 🔄 输出 PDF 或 Markdown
            - 🖥️ 全新 Apple Style 图形界面

            ### 使用方式
            1. 下载对应平台的版本
            2. 解压到任意目录
            3. 运行应用程序
          files: |
            YT-PDFCleaner-${{ github.ref_name }}-windows-x64.zip
            YT-PDFCleaner-${{ github.ref_name }}-macos-universal.zip
            YT-PDFCleaner-${{ github.ref_name }}-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
